
<script>
const pages = {
  dashboard:"Dashboard",
  assistant:"AI Assistant",
  content:"Content Studio",
  ads:"Advertisement Generator",
  video:"AI Video Maker",
  social:"Social Media Manager",
  whatsapp:"WhatsApp Manager",
  email:"Email Manager",
  automation:"Automation",
  reports:"Business Reports",
  settings:"Settings"
};

function showPage(id, button) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("pageTitle").textContent = pages[id];
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  if (button) button.classList.add("active");
}

function getSaved() {
  try {
    return JSON.parse(localStorage.getItem("raza_business_content") || "[]");
  } catch (e) {
    return [];
  }
}

function updateCount() {
  const count = getSaved().length;
  document.getElementById("savedCount").textContent = count;
  document.getElementById("reportCount").textContent = count;
}

function saveText(text, type) {
  if (!text.trim()) return alert("Pehle content generate karein.");

  const saved = getSaved();
  saved.unshift({
    text,
    type,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("raza_business_content", JSON.stringify(saved));
  updateCount();
  alert("Content saved successfully!");
}

function saveOutput(id) {
  const output = document.getElementById(id);
  saveText(output.textContent, id);
}

async function callAI(handler, payload) {
  const response = await fetch(
    "/api/router?handler=" + encodeURIComponent(handler),
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "AI request failed.");
  }

  if (!data.text) {
    throw new Error("AI returned an empty response.");
  }

  return data.text;
}

async function runAI(handler, payload, outputId, button) {
  const output = document.getElementById(outputId);
  const originalText = button ? button.textContent : "";

  output.textContent = "RAZA TECH AI is working...";

  if (button) {
    button.disabled = true;
    button.textContent = "Please wait...";
  }

  try {
    const result = await callAI(handler, payload);
    output.textContent = result;
    return result;
  } catch (error) {
    output.textContent = "Error: " + error.message;
    return null;
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = originalText;
    }
  }
}

async function askAI() {
  const q = document.getElementById("ask").value.trim();
  const button = document.querySelector("#assistant button");

  if (!q) return alert("Apna task likhein.");

  await runAI(
    "assistant",
    {
      prompt: q,
      task: "business assistance"
    },
    "answer",
    button
  );
}

async function generateContent() {
  const business = document.getElementById("business").value.trim();
  const product = document.getElementById("product").value.trim();
  const platform = document.getElementById("platform").value;
  const language = document.getElementById("language").value;
  const details = document.getElementById("details").value.trim();
  const button = document.querySelector("#content button");

  if (!business || !product) {
    return alert("Business name aur product likhein.");
  }

  await runAI(
    "content",
    {
      business,
      product,
      platform,
      tone: "Professional and engaging",
      details: details + "\nLanguage: " + language,
      task: "Create social media marketing content"
    },
    "contentOutput",
    button
  );
}

async function generateAd() {
  const product = document.getElementById("adProduct").value.trim();
  const offer = document.getElementById("adOffer").value.trim();
  const audience = document.getElementById("audience").value.trim();
  const platform = document.getElementById("adPlatform").value;
  const button = document.querySelector("#ads button");

  if (!product) return alert("Product name likhein.");

  await runAI(
    "advertisement",
    {
      business: "RAZA TECHNOLOGIES AI",
      product,
      platform,
      audience,
      objective: "Increase awareness and sales",
      offer,
      tone: "Professional and persuasive",
      details: "Create an attractive advertisement. Do not invent product claims."
    },
    "adOutput",
    button
  );
}

async function generateVideoScript() {
  const topic = document.getElementById("videoTopic").value.trim();
  const duration = document.getElementById("duration").value;
  const button = document.querySelector("#video button");

  if (!topic) return alert("Video topic likhein.");

  await runAI(
    "video",
    {
      business: "RAZA TECHNOLOGIES AI",
      product: topic,
      platform: "Instagram Reels / TikTok / YouTube Shorts",
      duration,
      style: "Professional and engaging",
      audience: "Relevant customers",
      objective: "Increase awareness and engagement",
      details: "Create a complete short-form video script with scenes and voiceover."
    },
    "videoOutput",
    button
  );
}

async function makeEmail() {
  const subject = document.getElementById("emailSubject").value.trim();
  const details = document.getElementById("emailText").value.trim();
  const button = document.querySelector("#email button");

  if (!subject && !details) {
    return alert("Email ka subject ya details likhein.");
  }

  await runAI(
    "email",
    {
      business: "RAZA TECHNOLOGIES AI",
      recipient: "Business customer or professional contact",
      purpose: subject,
      keyPoints: details,
      tone: "Professional",
      language: "English",
      details
    },
    "emailOutput",
    button
  );
}

function saveSettings() {
  localStorage.setItem(
    "raza_workspace_name",
    document.getElementById("workspaceName").value
  );

  localStorage.setItem(
    "raza_tagline",
    document.getElementById("tagline").value
  );

  document.getElementById("settingsOutput").textContent =
    "Settings saved successfully.";
}

document.addEventListener("DOMContentLoaded", () => {
  const name = localStorage.getItem("raza_workspace_name");
  const tagline = localStorage.getItem("raza_tagline");

  if (name) {
    document.getElementById("workspaceName").value = name;
  }

  if (tagline) {
    document.getElementById("tagline").value = tagline;
  }

  // Remove the old assistant demo warning:
  const assistantNotice = document.querySelector("#assistant .notice");
  if (assistantNotice) assistantNotice.remove();

  updateCount();
});
</script>
